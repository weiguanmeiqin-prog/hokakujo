<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静養室</title>

<style>
body{
  margin:0;
  background:
    radial-gradient(circle at top,
    #1a2230 0%,
    #0a0d12 50%,
    #050607 100%);

  color:#d8dde3;
  font-family:"Yu Gothic UI",sans-serif;

  padding:40px 20px;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  font-weight:500;
  letter-spacing:0.15em;
}

.subtitle{
  opacity:0.6;
  line-height:1.9;
  margin-bottom:35px;
}

textarea{
  width:100%;
  height:120px;

  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);

  color:#d8dde3;

  padding:15px;
  box-sizing:border-box;

  resize:none;

  font-family:inherit;
}

button{
  margin-top:14px;
  background:rgba(255,255,255,0.05);
  color:#d8dde3;

  border:1px solid rgba(255,255,255,0.1);

  padding:10px 18px;

  cursor:pointer;
}

button:hover{
  background:rgba(255,255,255,0.1);
}

.posts{
  margin-top:45px;
}

.post{
  border-left:1px solid rgba(255,255,255,0.12);
  padding-left:16px;
  margin-bottom:24px;

  opacity:0.75;
  line-height:1.9;
}

.time{
  opacity:0.45;
  font-size:0.8rem;
  margin-bottom:6px;
}

.back{
  display:inline-block;
  margin-top:35px;
  color:#9fb4c9;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>静養室</h1>

<div class="subtitle">
言葉にならない感情を、一時的に預けることができます。<br>
無理に整理する必要はありません。
</div>

<textarea id="input" placeholder="保護してほしい感情を書いてください"></textarea>

<br>

<button onclick="savePost()">
保護申請
</button>

<div class="posts" id="posts"></div>

<a class="back" href="index.html">
← 保護室へ戻る
</a>

</div>

<script>

const postsDiv = document.getElementById("posts");

function loadPosts(){

  postsDiv.innerHTML = "";

  const posts = JSON.parse(localStorage.getItem("emotionPosts") || "[]");

  posts.reverse().forEach(post => {

    const div = document.createElement("div");

    div.className = "post";

    div.innerHTML = `
      <div class="time">${post.time}</div>
      ${post.text}
    `;

    postsDiv.appendChild(div);

  });
}

function savePost(){

  const input = document.getElementById("input");

  const text = input.value.trim();

  if(!text) return;

  const now = new Date();

  const time =
    String(now.getMonth() + 1).padStart(2,"0") + "/" +
    String(now.getDate()).padStart(2,"0") + " " +
    String(now.getHours()).padStart(2,"0") + ":" +
    String(now.getMinutes()).padStart(2,"0");

  const posts = JSON.parse(localStorage.getItem("emotionPosts") || "[]");

  posts.push({
    text,
    time
  });

  localStorage.setItem("emotionPosts", JSON.stringify(posts));

  input.value = "";

  loadPosts();
}

loadPosts();

</script>

</body>
</html>
