<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>夜間感情保護室</title>

  <meta name="description" content="深夜に行き場を失った感情を一時保管しています。">
  <meta name="keywords" content="夜間感情保護室, 深夜, 感情, 創作, 静かなサイト">

  <meta property="og:title" content="夜間感情保護室">
  <meta property="og:description" content="眠れない夜のための一時保護施設">
  <meta property="og:type" content="website">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      color: #d8dde3;
      font-family: "Yu Gothic UI", sans-serif;

      background:
        radial-gradient(circle at top,
        #1a2230 0%,
        #0c1016 45%,
        #06080b 100%);

      transition: background 1.5s ease;
    }

    /* ノイズ */
    .noise {
      position: fixed;
      inset: 0;
      opacity: 0.04;

      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.05) 0px,
          rgba(255,255,255,0.05) 1px,
          transparent 1px,
          transparent 3px
        );

      pointer-events: none;
      z-index: 1;
    }

    /* 雨 */
    .rain {
      position: fixed;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 2;

      background-image:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0.18) 100%
        );

      background-size: 2px 80px;

      animation: rainMove 0.35s linear infinite;

      transition: opacity 1s ease;
    }

    @keyframes rainMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 80px;
      }
    }

    .container {
      height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 20px;

      position: relative;
      z-index: 3;
    }

    h1 {
      font-size: 2.3rem;
      letter-spacing: 0.18em;
      margin-bottom: 18px;
      font-weight: 500;
      line-height: 1.7;
    }

    .subtitle {
      font-size: 0.92rem;
      opacity: 0.68;
      margin-bottom: 28px;
      line-height: 2;
      max-width: 620px;
    }

    .status {
      font-size: 0.78rem;
      opacity: 0.42;
      margin-bottom: 35px;
      letter-spacing: 0.08em;
    }

    .logs {
      width: 100%;
      max-width: 500px;

      text-align: left;

      margin-bottom: 35px;

      border-left: 1px solid rgba(255,255,255,0.1);

      padding-left: 18px;
    }

    .log {
      margin-bottom: 14px;
      font-size: 0.86rem;
      opacity: 0.58;
      line-height: 1.8;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 240px;
    }

    .menu a {
      border: 1px solid rgba(255,255,255,0.1);

      color: #d8dde3;
      text-decoration: none;

      padding: 12px;

      transition: 0.3s;

      background: rgba(255,255,255,0.03);

      backdrop-filter: blur(4px);

      font-size: 0.88rem;
    }

    .menu a:hover {
      background: rgba(255,255,255,0.08);
      letter-spacing: 0.05em;
    }

    .warning {
      margin-top: 34px;

      font-size: 0.75rem;

      opacity: 0.32;

      max-width: 520px;

      line-height: 2;
    }

    .footer {
      position: absolute;
      bottom: 18px;

      font-size: 0.7rem;

      opacity: 0.22;

      letter-spacing: 0.14em;

      z-index: 3;
    }
  </style>
</head>

<body>

<div class="noise"></div>

<div class="rain" id="rain"></div>

<div class="container">

  <h1>
    夜間感情保護室
  </h1>

  <div class="subtitle" id="subtitle">
    ここでは未整理の孤独や不安を、<br>
    一時的に保護しています。
  </div>

  <div class="status" id="statusText">
    現在、静養室を開放中
  </div>

  

    <div class="log">
      未返却一覧：
      帰宅拒否感情 /
      未送信メッセージ由来感情
    </div>

    <div id="nightLogs"></div>

  </div>

  <div class="menu">
    <a href="#">保護記録</a>
    <a href="#">未返却一覧</a>
    <a href="#">静養室</a>
  </div>

  <div class="warning">
    無理に感情を整理する必要はありません。<br>
    眠れない場合は、しばらくここにいてください。
  </div>

</div>

<div class="footer">
  NIGHT EMOTION CARE ROOM
</div>
  <script>

/* =========================
   夜間感情保護室 システム
========================= */

const hour = new Date().getHours();

const statusText = document.getElementById("statusText");
const subtitle = document.getElementById("subtitle");
const rain = document.getElementById("rain");
const nightLogs = document.getElementById("nightLogs");

/* =========================
   深夜モード
========================= */

if(hour >= 23 || hour <= 4){

  document.body.style.background =
    "radial-gradient(circle at top, #111722 0%, #05070a 65%, #020304 100%)";

  statusText.textContent =
    "現在、保護要請が増加しています";

  subtitle.innerHTML =
    "深夜になると、感情は居場所を見失うことがあります。<br>現在、静養室を開放しています。";

  rain.style.opacity = "0.12";
}

/* =========================
   自動ログ生成
========================= */

/* 保護対象候補 */
const emotions = [

  "眠れなさ",
  "帰りたくなさ",
  "未送信感情",
  "名前不明の焦燥",
  "深夜の万能感",
  "理由のない不安",
  "返信できなさ",
  "雨天由来感情",
  "孤独感",
  "未整理感情",
  "帰宅拒否感情",
  "存在希薄感",
  "午前二時の寂しさ",
  "思考過多状態"

];

/* 行動候補 */
const actions = [

  "を保護",
  "を確認",
  "を一時収容",
  "の滞留を観測",
  "を回収",
  "の再流出を確認"

];

/* ランダム生成 */
function createLog(){

  const emotion =
    emotions[Math.floor(Math.random() * emotions.length)];

  const action =
    actions[Math.floor(Math.random() * actions.length)];

  /* 時刻生成 */
  const now = new Date();

  const hh =
    String(now.getHours()).padStart(2, "0");

  const mm =
    String(now.getMinutes()).padStart(2, "0");

  /* ログ生成 */
  const log = document.createElement("div");

  log.className = "log";

  log.style.opacity = "0";

  log.style.transition = "1.2s";

  log.innerHTML =
    `${hh}:${mm}　「${emotion}」${action}`;

  /* 一番上に追加 */
  nightLogs.prepend(log);

  /* フェード表示 */
  setTimeout(() => {
    log.style.opacity = "0.58";
  }, 50);

  /* ログ増えすぎ防止 */
  const logs = nightLogs.querySelectorAll(".log");

  if(logs.length > 8){
    logs[logs.length - 1].remove();
  }
}

/* 初回生成 */
createLog();

/* 8秒ごとに追加 */
setInterval(createLog, 50000);

</script>

</body>
</html>
