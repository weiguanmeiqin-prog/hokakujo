<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>夜間感情保護室</title>

  <!-- 検索向け -->
  <meta name="description" content="深夜に行き場を失った感情を一時保管しています。">
  <meta name="keywords" content="夜間感情保護室, 深夜, 感情, 創作, 静かなサイト">

  <!-- SNS埋め込み -->
  <meta property="og:title" content="夜間感情保護室">
  <meta property="og:description" content="眠れない夜のための一時保護施設">
  <meta property="og:type" content="website">

  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at top, #1a2230 0%, #0c1016 45%, #06080b 100%);
      color: #d8dde3;
      font-family: "Yu Gothic UI", sans-serif;
      overflow: hidden;
    }

    /* 背景ノイズ */
    .noise {
      position: fixed;
      width: 100%;
      height: 100%;
      opacity: 0.04;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.05) 0px,
          rgba(255,255,255,0.05) 1px,
          transparent 1px,
          transparent 3px
        );
      pointer-events: none;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2.3rem;
      letter-spacing: 0.18em;
      margin-bottom: 18px;
      font-weight: 500;
      line-height: 1.7;
    }

    .subtitle {
      font-size: 0.92rem;
      opacity: 0.68;
      margin-bottom: 30px;
      line-height: 2;
      max-width: 620px;
    }

    .status {
      font-size: 0.78rem;
      opacity: 0.42;
      margin-bottom: 38px;
      letter-spacing: 0.08em;
    }

    .logs {
      width: 100%;
      max-width: 480px;
      text-align: left;
      margin-bottom: 35px;
      border-left: 1px solid rgba(255,255,255,0.1);
      padding-left: 18px;
    }

    .log {
      margin-bottom: 14px;
      font-size: 0.86rem;
      opacity: 0.58;
      line-height: 1.8;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 240px;
    }

    .menu a {
      border: 1px solid rgba(255,255,255,0.1);
      color: #d8dde3;
      text-decoration: none;
      padding: 12px;
      transition: 0.3s;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(4px);
      font-size: 0.88rem;
    }

    .menu a:hover {
      background: rgba(255,255,255,0.08);
      letter-spacing: 0.05em;
    }

    .warning {
      margin-top: 34px;
      font-size: 0.75rem;
      opacity: 0.32;
      max-width: 520px;
      line-height: 2;
    }

    .footer {
      position: absolute;
      bottom: 18px;
      font-size: 0.7rem;
      opacity: 0.22;
      letter-spacing: 0.14em;
    }
  </style>
</head>

<body>

<div class="noise"></div>

<div class="container">

  <h1>
    夜間感情保護室
  </h1>

  <div class="subtitle">
    深夜になると、感情は居場所を見失うことがあります。<br>
    ここでは未整理の孤独や不安を、一時的に保護しています。
  </div>

  <div class="status" id="statusText">
    現在、静養室を開放中
  </div>

  <div class="logs">

    <div class="log">
      05/07 01:14　「帰りたくなさ」を保護
    </div>

    <div class="log">
      05/07 02:03　未送信感情を確認
    </div>

    <div class="log">
      05/07 02:41　名前不明の焦燥を一時収容
    </div>

  </div>

  <div class="menu">
    <a href="#">保護記録</a>
    <a href="#">未返却一覧</a>
    <a href="#">静養室</a>
  </div>

  <div class="warning">
    無理に感情を整理する必要はありません。<br>
    眠れない場合は、しばらくここにいてください。
  </div>

</div>

<div class="footer">
  NIGHT EMOTION CARE ROOM
</div>

<script>
  const hour = new Date().getHours();
  const statusText = document.getElementById("statusText");

  if(hour >= 23 || hour <= 4){
    statusText.textContent = "現在、保護要請が増加しています";
  } else {
    statusText.textContent = "現在、静養室を開放中";
  }
</script>

</body>
</html>
