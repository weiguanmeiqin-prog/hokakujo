<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>失踪物捕獲場</title>

  <!-- 検索向け -->
  <meta name="description" content="夜間感情保護施設『失踪物捕獲場』。23:00以降、感情失踪率増加。">
  <meta name="keywords" content="失踪物捕獲場, 感情, 深夜, 創作, ARG">
  
  <!-- SNS埋め込み -->
  <meta property="og:title" content="失踪物捕獲場">
  <meta property="og:description" content="夜間感情保護施設">
  <meta property="og:type" content="website">

  <style>
    body {
      margin: 0;
      background: #050505;
      color: #d8dde3;
      font-family: "Yu Gothic UI", sans-serif;
      overflow: hidden;
    }

    .noise {
      position: fixed;
      width: 100%;
      height: 100%;
      opacity: 0.04;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.05) 0px,
          rgba(255,255,255,0.05) 1px,
          transparent 1px,
          transparent 2px
        );
      pointer-events: none;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 0.2em;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .subtitle {
      font-size: 0.9rem;
      opacity: 0.6;
      margin-bottom: 35px;
      line-height: 1.8;
    }

    .status {
      font-size: 0.8rem;
      opacity: 0.5;
      margin-bottom: 40px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 240px;
    }

    .menu a {
      border: 1px solid rgba(255,255,255,0.15);
      color: #d8dde3;
      text-decoration: none;
      padding: 12px;
      transition: 0.3s;
      background: rgba(255,255,255,0.02);
    }

    .menu a:hover {
      background: rgba(255,255,255,0.08);
      letter-spacing: 0.08em;
    }

    .footer {
      position: absolute;
      bottom: 18px;
      font-size: 0.7rem;
      opacity: 0.25;
      letter-spacing: 0.15em;
    }

    .warning {
      margin-top: 30px;
      font-size: 0.75rem;
      opacity: 0.35;
      max-width: 500px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

<div class="noise"></div>

<div class="container">

  <h1>失踪物捕獲場</h1>

  <div class="subtitle">
    夜間感情保護施設<br>
    23:00以降、感情失踪率増加
  </div>

  <div class="status" id="statusText">
    回収業務待機中
  </div>

  <div class="menu">
    <a href="#">記録閲覧</a>
    <a href="#">未分類保管庫</a>
    <a href="#">返却申請</a>
  </div>

  <div class="warning">
    感情の自己回収は推奨されていません。<br>
    未返却状態が長期化した場合、別の記憶が混入する可能性があります。
  </div>

</div>

<div class="footer">
  FACILITY ID : Y-23
</div>

<script>
  const hour = new Date().getHours();
  const statusText = document.getElementById("statusText");

  if(hour >= 23 || hour <= 4){
    statusText.textContent = "回収業務増加中";
  } else {
    statusText.textContent = "回収業務待機中";
  }
</script>

</body>
</html>
